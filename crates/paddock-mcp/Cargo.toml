[package]
name = "paddock-mcp"
description = "MCP (Model Context Protocol) client for Paddock: a thin wrapper over the official rmcp SDK with a lazy, shared connection pool over stdio and Streamable HTTP."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rmcp = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Only to build the HTTP transport's header map; rmcp owns the reqwest client.
http = "1"
# Parse the `state` (CSRF) param out of the authorization URL rmcp generates.
url = "2"
