[package]
name = "paddock-admin"
description = "Runner admin surface: the versioned local wire contract (identify/health/drain/shutdown/stats) over Windows named pipes / Unix domain sockets. Never binds TCP."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
ciborium.workspace = true
http-body-util.workspace = true
hyper = { version = "1.11.0", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1.20", features = ["tokio", "server", "service"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zstd.workspace = true

[lints]
workspace = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Memory"] }
